name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Goldens draw text as blocks, so they do not depend on the image. The
    # image is still pinned so a new LTS never lands on a push that changed
    # nothing.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: a new engine can repaint shapes a pixel differently and
          # fail goldens on a push that changed nothing. Bump deliberately and
          # regenerate goldens in the same change if they move.
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Format, analyze, test
        run: ./scripts/check.sh

      - name: Upload golden failures
        # Golden diffs are the one failure that is impossible to debug from a
        # log, so keep the images when they happen.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub.dev score
        # 160 is a perfect score. Anything less is a regression: a missing
        # dartdoc, a stale dependency, a packaging mistake.
        run: ./scripts/score.sh 160
