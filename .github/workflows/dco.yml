name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (`git commit -s`). The check itself lives in scripts/dco.sh so a
# contributor can run the same thing before pushing.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so base..head can be walked.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/dco.sh "$BASE" "$HEAD"
