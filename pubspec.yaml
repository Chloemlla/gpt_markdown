name: gpt_markdown_chloemlla
description: "Powerful Flutter Markdown & LaTeX Renderer: Rich Text, Math, Tables, Links, and Text Selection. Ideal for ChatGPT, Gemini, and more."
version: '2.0.0'
homepage: https://github.com/Chloemlla/gpt_markdown
repository: https://github.com/Chloemlla/gpt_markdown
issue_tracker: https://github.com/Chloemlla/gpt_markdown/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  # RadioGroup, used by the radio list marker, was added in 3.32.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  csslib: ^1.0.2
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/github-markdown.css
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: lib/fonts/JetBrainsMono-Regular.ttf

topics:
  - markdown
  - latex
  - selectable
  - chatgpt
  - gemini
